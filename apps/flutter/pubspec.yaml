name: halo
description: "clash-halo client"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^2.0.0
  ffi: ^2.1.0

  halo_contracts:
    path: ../../packages/contracts
  halo_domain:
    path: ../../packages/domain
  halo_config:
    path: ../../packages/config
  halo_storage:
    path: ../../packages/storage
  sqlite3: ^3.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.26.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Brand artwork, generated by tools/build-icons.py from the same cat mark as
  # the window and tray icons so the three surfaces cannot drift apart.
  assets:
    - assets/brand/brand_cat.png
